# Include this file inside the production HTTPS `server {}` block.
# The static documents remain usable when the Node/PM2 upstream is unavailable.

proxy_intercept_errors on;

error_page 502 /__system-errors/502.html;
error_page 503 /__system-errors/503.html;
error_page 504 /__system-errors/504.html;

location = /__system-errors/502.html {
    internal;
    alias /home/codespace/phishtopia/public/__system-errors/502.html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /__system-errors/503.html {
    internal;
    alias /home/codespace/phishtopia/public/__system-errors/503.html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /__system-errors/504.html {
    internal;
    alias /home/codespace/phishtopia/public/__system-errors/504.html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /__system-errors/upstream-errors.css {
    alias /home/codespace/phishtopia/public/__system-errors/upstream-errors.css;
    access_log off;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /__system-errors/logo.png {
    alias /home/codespace/phishtopia/public/images/phishLogo.png;
    access_log off;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /__system-errors/502.webp {
    alias /home/codespace/phishtopia/public/images/errors/502.webp;
    access_log off;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /__system-errors/503.webp {
    alias /home/codespace/phishtopia/public/images/errors/503.webp;
    access_log off;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /__system-errors/504.webp {
    alias /home/codespace/phishtopia/public/images/errors/504.webp;
    access_log off;
    add_header Cache-Control "public, max-age=3600" always;
}
