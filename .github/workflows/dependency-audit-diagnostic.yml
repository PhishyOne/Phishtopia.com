name: Dependency lock refresh diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lock-refresh:
    name: Commit EJS 6 lock refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate exact EJS 6.0.1 dependency files
        run: npm install --package-lock-only --ignore-scripts --save-prefix='^' ejs@6.0.1
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit generated dependency files
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'dependency_files_already_current=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Upgrade EJS to remove vulnerable dependency chain'
          git push origin "HEAD:$TARGET_BRANCH"
