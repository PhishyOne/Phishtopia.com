name: Dependency lock refresh diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lock-refresh:
    name: Generate EJS 6 lock refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate exact EJS 6.0.1 dependency files
        run: npm install --package-lock-only --ignore-scripts --save-prefix='^' ejs@6.0.1
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: ejs-6-lock-refresh
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
