name: Phishtopia Ops controller

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: read

concurrency:
  group: phishtopia-ops-controller-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  controller:
    if: github.repository == 'PhishyOne/Phishtopia.com' && github.event.issue.number == 43 && github.actor_id == '123998606'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ops/phishtopia-ops-mcp
    env:
      QUEUE_ISSUE: '43'
    steps:
      - uses: actions/checkout@v4
      - name: Validate issue command
        id: prepare
        run: python3 -m controller.github_event "$GITHUB_EVENT_PATH" --queue-issue "$QUEUE_ISSUE" --request-file /tmp/ops-request.json
      - name: Authenticate with short-lived Google OIDC
        id: auth
        if: steps.prepare.outputs.decision == 'accepted'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/107649778409/locations/global/workloadIdentityPools/github-phishtopia-ops/providers/phishtopia-ops
          service_account: phishtopia-ops-controller@project-43a8be4b-69a7-4d52-805.iam.gserviceaccount.com
      - name: Install Google Cloud CLI
        id: setup
        if: steps.prepare.outputs.decision == 'accepted'
        uses: google-github-actions/setup-gcloud@v3
      - name: Submit and await sanitized response
        if: steps.prepare.outputs.decision == 'accepted'
        id: transport
        continue-on-error: true
        run: python3 -m controller.github_transport --request-file /tmp/ops-request.json --response-file /tmp/ops-response.json --comment-file /tmp/ops-comment.md
      - name: Record sanitized result
        id: post_success
        if: steps.prepare.outputs.decision == 'accepted' && steps.transport.outcome == 'success'
        run: |
          cat /tmp/ops-comment.md
          cat /tmp/ops-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record sanitized controller failure
        if: always() && steps.prepare.outputs.decision == 'accepted' && steps.post_success.outcome != 'success'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          body = (
              "### Phishtopia Ops\n\n"
              "Controller setup or transport failed before a validated result was returned. "
              f"GitHub Actions run `{os.environ['RUN_ID']}` contains the bounded diagnostic. "
              "No raw provider output, credentials, commands, logs, or secret values are included here."
          )
          print(body)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a",
              encoding="utf-8",
          ) as handle:
              handle.write(body + "\n")
          PY
          exit 1
