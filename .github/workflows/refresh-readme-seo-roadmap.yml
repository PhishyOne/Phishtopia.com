name: Refresh README SEO status

on:
  push:
    branches:
      - docs/refresh-readme-2026-08
    paths:
      - .github/workflows/refresh-readme-seo-roadmap.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/refresh-readme-2026-08
          fetch-depth: 0

      - name: Update completed SEO work in README
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()

          text = text.replace(
              "- automated tests that lock the reviewed share-card files and reject alpha-channel regressions\n",
              "- automated tests that lock the reviewed share-card files and reject alpha-channel regressions\n"
              "- a public canonical sitemap and crawler-friendly `robots.txt` with private routes excluded\n",
              1,
          )

          old = """Most of issue #72 is complete, including distinct page metadata and reviewed share cards. Remaining repository work includes:

- add a public `sitemap.xml`
- add a valid `robots.txt` that references the sitemap
- add homepage `WebSite` structured data
- verify the deployed pages with social preview tools
- complete Google Search Console and Bing Webmaster verification/submission
"""

          new = """Most of issue #72 is complete, including distinct page metadata, reviewed share cards, a public canonical sitemap, and crawler guidance that excludes private and utility routes. Remaining follow-up includes:

- add homepage `WebSite` structured data
- verify the deployed pages with social preview tools
- complete Google Search Console and Bing Webmaster verification/submission
"""

          if old not in text:
              raise SystemExit("Expected README SEO roadmap block was not found")

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit README update and remove one-shot workflow
        run: |
          rm .github/workflows/refresh-readme-seo-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/refresh-readme-seo-roadmap.yml
          git diff --cached --quiet && {
            echo "Expected README changes were not produced." >&2
            exit 1
          }
          git commit -m "Document completed SEO files"
          git push origin HEAD:docs/refresh-readme-2026-08
