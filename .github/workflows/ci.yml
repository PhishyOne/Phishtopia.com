name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned Gitleaks 8.30.1
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact --verbose

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate

  worker-tests:
    name: Python worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact workflow commit
        run: |
          install -d /tmp/phishtopia-source
          curl --fail --location --silent --show-error \
            "https://github.com/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz" \
            --output /tmp/phishtopia-source.tar.gz
          tar -xzf /tmp/phishtopia-source.tar.gz -C /tmp/phishtopia-source --strip-components=1
      - name: Run bounded worker tests
        working-directory: /tmp/phishtopia-source/ops/phishtopia-ops-mcp
        run: |
          set +e
          python3 -m unittest discover -s worker/test -p 'test_*.py' -v >/tmp/worker-tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/worker-tests.log
            exit "$status"
          fi
          cat /tmp/worker-tests.log

  ops-security:
    name: Ops security and fake integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ops/phishtopia-ops-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ops/phishtopia-ops-mcp/package-lock.json
      - run: npm ci
      - name: Typecheck, test, and protocol smoke
        run: |
          npm run format:check
          npm run typecheck
          npm test
          npm run smoke
      - name: External controller tests
        run: python3 -m unittest discover -s controller/test -p 'test_*.py' -v
      - name: Compile external controller
        run: python3 -m compileall -q controller
      - name: Parse privileged shell scripts
        run: |
          set -eu
          for script in scripts/*.sh systemd/phishtopia-ops-mcp-tunnel-launch; do
            sh -n "$script"
          done
      - run: ./scripts/secret-scan.sh
      - run: npm audit --omit=dev --audit-level=moderate
