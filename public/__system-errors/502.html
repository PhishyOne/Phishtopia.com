<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#020e18">
    <title>502 Bad gateway | Phishtopia</title>
    <link rel="stylesheet" href="/__system-errors/upstream-errors.css">
  </head>
  <body style="--scene: url('/__system-errors/502.webp'); --cyan: #31d7f3; --orange: #ff9a58;">
    <div class="shell">
      <header class="brand">
        <img src="/__system-errors/logo.png" alt="Phishtopia">
        <div class="brand-text">
          <span class="brand-name">PHISHTOPIA</span>
          <span class="brand-tagline">Home of the Improbable.</span>
        </div>
      </header>

      <main>
        <div class="scene" aria-hidden="true"></div>

        <section class="content" aria-labelledby="error-title">
          <span class="sr-only">Error 502.</span>
          <p class="eyebrow">Bad gateway</p>
          <h1 id="error-title">The current was interrupted.</h1>
          <p class="message">Phishtopia’s gateway could not reach the application.</p>

          <nav class="actions" aria-label="Recovery links">
            <a class="action" href="/">Back Home</a>
            <a class="action action--retry" href="">Try Again</a>
          </nav>
        </section>
      </main>

      <footer>Home of the Improbable.</footer>
    </div>
  </body>
</html>
