<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">EchoTrace</title>
  <desc id="desc">A futuristic radar display and connected star map for EVE Online player intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#02070c"/><stop offset=".6" stop-color="#071f2d"/><stop offset="1" stop-color="#123f4f"/></linearGradient>
    <radialGradient id="radar"><stop stop-color="#62f4ff" stop-opacity=".38"/><stop offset="1" stop-color="#62f4ff" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(875 315)">
    <circle r="245" fill="url(#radar)"/>
    <g fill="none" stroke="#5ee9f4" stroke-opacity=".4" stroke-width="2"><circle r="210"/><circle r="155"/><circle r="100"/><circle r="45"/><path d="M-240 0H240M0-240V240M-170-170L170 170M170-170L-170 170"/></g>
    <path d="M0 0L184-106A212 212 0 0 1 202 63Z" fill="#58eaf5" fill-opacity=".12" stroke="#69f2fb" stroke-opacity=".45"/>
    <g fill="#a9fbff" filter="url(#glow)"><circle cx="126" cy="-78" r="7"/><circle cx="-92" cy="118" r="6"/><circle cx="44" cy="165" r="5"/><circle cx="-150" cy="-46" r="4"/><circle cx="12" cy="-124" r="5"/></g>
    <g stroke="#70eaf4" stroke-width="2" stroke-opacity=".65"><path d="M126-78L12-124L-150-46L-92 118L44 165L126-78" fill="none"/></g>
  </g>
  <g fill="#eaffff">
    <text x="72" y="185" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="-2">EchoTrace</text>
    <text x="76" y="252" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#65e7f1" letter-spacing="4">EVE PLAYER INTELLIGENCE</text>
    <text x="76" y="350" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#c8e9ed">Follow public character signals.</text>
    <text x="76" y="392" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#c8e9ed">See the connections behind the name.</text>
  </g>
  <rect x="74" y="484" width="312" height="58" rx="29" fill="#001017" fill-opacity=".8" stroke="#5be9f3" stroke-opacity=".55"/>
  <text x="230" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#dffeff">phishtopia.com/echotrace</text>
