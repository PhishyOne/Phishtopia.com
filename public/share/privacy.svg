    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04151a"/><stop offset=".55" stop-color="#075763"/><stop offset="1" stop-color="#13949b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#001014" flood-opacity=".6"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity=".13" fill="none" stroke="#bdfcff" stroke-width="3"><circle cx="1040" cy="95" r="34"/><circle cx="1088" cy="170" r="15"/><circle cx="950" cy="535" r="24"/><path d="M0 525C220 465 410 585 640 525S980 465 1200 525"/></g>
