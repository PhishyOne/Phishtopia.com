  <text x="74" y="342" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#d9f8f9">What is collected. Why it is needed.</text>
  <text x="74" y="384" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#d9f8f9">Where it goes. Written like a human.</text>
