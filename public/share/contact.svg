<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Contact Phishtopia</title>
  <desc id="desc">A glowing message envelope inviting questions, feedback, and new ideas for Phishtopia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset=".55" stop-color="#293b78"/><stop offset="1" stop-color="#6277d6"/></linearGradient>
    <radialGradient id="glow" cx="75%" cy="46%" r="44%"><stop stop-color="#b9c6ff" stop-opacity=".45"/><stop offset="1" stop-color="#b9c6ff" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#040717" flood-opacity=".58"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(700 140)" filter="url(#shadow)">
    <rect x="0" y="0" width="390" height="300" rx="30" fill="#eff2ff" stroke="#c4ceff" stroke-width="7"/>
    <path d="M18 35L195 175L372 35" fill="none" stroke="#6577ce" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 270L145 158M372 270L245 158" fill="none" stroke="#97a5e8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="330" cy="260" r="62" fill="#ff9e4a" stroke="#ffd0a5" stroke-width="7"/>
    <path d="M303 260H357M330 233V287" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g fill="#f6f8ff">
    <text x="72" y="180" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="850">Contact Me</text>
    <text x="76" y="247" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="750" fill="#c9d2ff" letter-spacing="4">QUESTIONS. FEEDBACK. IDEAS.</text>
    <text x="76" y="348" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#e2e7ff">Found a problem? Thought of something better?</text>
    <text x="76" y="390" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#e2e7ff">Tell me what Phishtopia should do next.</text>
  </g>
  <rect x="74" y="486" width="290" height="58" rx="29" fill="#080d20" fill-opacity=".76" stroke="#bcc8ff" stroke-opacity=".58"/>
  <text x="219" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f7f8ff">phishtopia.com/contact</text>
</svg>
