    <text x="82" y="374" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#d5f7fa">Useful tools, strange experiments,</text>
    <text x="82" y="414" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#d5f7fa">and whatever comes next.</text>
