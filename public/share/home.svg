<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Phishtopia</title>
  <desc id="desc">An underwater technology scene with a glowing fish and the words Home of the Improbable.</desc>
  <defs>
